<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="A little place for Lena.">
  <title>For Lena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="letter" aria-labelledby="page-title">
      <p class="eyebrow">a little place on the internet</p>
      <h1 id="page-title">For Lena</h1>
      <section class="note" aria-label="Lena" aria-live="polite">
        <p class="note-label">Lena</p>
        <p id="owner-note" class="note-text">A little message will appear here.</p>
      </section>
      <form id="message-form" class="message-form" method="post" target="message-frame">
        <label class="visually-hidden" for="visitor-message">What do you want to say?</label>
        <textarea id="visitor-message" name="message" placeholder="what do u wanna say" maxlength="1500" rows="4" required></textarea>
        <label class="honeypot" aria-hidden="true">Leave this field empty
          <input name="website" type="text" tabindex="-1" autocomplete="off">
        </label>
        <input id="request-id" type="hidden" name="requestId" value="">
        <div class="form-bottom">
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          <button id="send-button" type="submit">send</button>
        </div>
      </form>
      <p class="footer-note">made with care</p>
    </section>
  </main>
  <iframe name="message-frame" id="message-frame" title="Message submission" class="hidden-frame"></iframe>
  <script src="app.js"></script>
</body>
</html>
